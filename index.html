<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<title>Textarea</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html {
    color-scheme: light dark;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    background-color: #fff;
    color: #161616;
  }

  @media (prefers-color-scheme: dark) {
    html {
      background-color: #0d1117;
      color: #c9d1d9;
    }
  }

  body {
    display: flex;
    flex-direction: column;
    height: 100vh;
    font: 16px / 1.6 system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: #f6f8fa;
    border-bottom: 1px solid #d0d7de;
    flex-shrink: 0;
  }

  @media (prefers-color-scheme: dark) {
    .toolbar {
      background: #161b22;
      border-bottom-color: #30363d;
    }
  }

  .toolbar button {
    padding: 6px 12px;
    border: 1px solid #d0d7de;
    background: #fff;
    color: #24292f;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    transition: all 0.2s;
  }

  @media (prefers-color-scheme: dark) {
    .toolbar button {
      background: #21262d;
      border-color: #30363d;
      color: #c9d1d9;
    }
  }

  .toolbar button:hover {
    background: #f3f4f6;
  }

  @media (prefers-color-scheme: dark) {
    .toolbar button:hover {
      background: #30363d;
    }
  }

  .toolbar-title {
    flex: 1;
    font-weight: 600;
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .container {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  .sidebar {
    width: 260px;
    background: #f6f8fa;
    border-right: 1px solid #d0d7de;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: transform 0.2s ease, width 0.2s ease;
  }

  .sidebar.hidden {
    transform: translateX(-100%);
    width: 0;
    border-right: none;
  }

  @media (prefers-color-scheme: dark) {
    .sidebar {
      background: #161b22;
      border-right-color: #30363d;
    }
  }

  .sidebar-header {
    padding: 12px;
    border-bottom: 1px solid #d0d7de;
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }

  @media (prefers-color-scheme: dark) {
    .sidebar-header {
      border-bottom-color: #30363d;
    }
  }

  .sidebar-header button {
    flex: 1;
    padding: 6px 10px;
    background: #fff;
    border: 1px solid #d0d7de;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 500;
    color: #24292f;
  }

  @media (prefers-color-scheme: dark) {
    .sidebar-header button {
      background: #21262d;
      border-color: #30363d;
      color: #c9d1d9;
    }
  }

  .sidebar-header button.active {
    background: #0969da;
    color: #fff;
    border-color: #0969da;
  }

  .sidebar-content {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }

  .doc-item {
    padding: 10px;
    margin-bottom: 4px;
    border-radius: 6px;
    cursor: pointer;
    background: transparent;
    border: 1px solid transparent;
    transition: all 0.2s;
    text-align: left;
  }

  .doc-item:hover {
    background: rgba(0, 0, 0, 0.05);
    border-color: #d0d7de;
  }

  @media (prefers-color-scheme: dark) {
    .doc-item:hover {
      background: rgba(255, 255, 255, 0.08);
    }
  }

  .doc-item.active {
    background: #0969da;
    color: #fff;
    border-color: #0969da;
  }

  .doc-title {
    font-weight: 500;
    font-size: 13px;
    margin-bottom: 3px;
  }

  .doc-meta {
    font-size: 11px;
    opacity: 0.7;
  }

  .main-content {
    display: flex;
    flex: 1;
    flex-direction: column;
    overflow: hidden;
  }

  .editor {
    flex: 1;
    padding: 24px max(24px, calc(50vw - 400px));
    outline: none;
    font: 18px / 1.5 system-ui;
    tab-size: 4;
    white-space: pre-wrap;
    overflow-wrap: break-word;
    overflow-y: auto;
    background: transparent;
    color: inherit;
    border: none;
    resize: none;
  }

  .landing {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 20px;
  }

  .landing h1 {
    font-size: 32px;
    margin-bottom: 12px;
  }

  .landing p {
    font-size: 16px;
    opacity: 0.6;
    margin-bottom: 40px;
  }

  .doc-list {
    width: 100%;
    max-width: 520px;
    margin-bottom: 32px;
  }

  .doc-list-title {
    text-align: left;
    font-weight: 600;
    margin-bottom: 12px;
    font-size: 14px;
  }

  .doc-list-items {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 400px;
    overflow-y: auto;
  }

  .landing-doc-item {
    padding: 12px 16px;
    background: #f6f8fa;
    border: 1px solid #d0d7de;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: left;
  }

  @media (prefers-color-scheme: dark) {
    .landing-doc-item {
      background: #21262d;
      border-color: #30363d;
    }
  }

  .landing-doc-item:hover {
    background: #f0f2f5;
  }

  @media (prefers-color-scheme: dark) {
    .landing-doc-item:hover {
      background: #30363d;
    }
  }

  .landing-doc-title {
    font-weight: 500;
    font-size: 14px;
    margin-bottom: 4px;
  }

  .landing-doc-time {
    font-size: 12px;
    opacity: 0.6;
  }

  .btn {
    padding: 10px 20px;
    border: 1px solid #d0d7de;
    background: #fff;
    color: #24292f;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    transition: all 0.2s;
  }

  @media (prefers-color-scheme: dark) {
    .btn {
      background: #21262d;
      border-color: #30363d;
      color: #c9d1d9;
    }
  }

  .btn:hover {
    background: #f0f2f5;
  }

  @media (prefers-color-scheme: dark) {
    .btn:hover {
      background: #30363d;
    }
  }

  .btn.primary {
    background: #0969da;
    color: #fff;
    border-color: #0969da;
  }

  .btn.primary:hover {
    background: #0860ca;
  }

  .notification {
    position: fixed;
    top: 16px;
    right: 16px;
    background: #28a745;
    color: #fff;
    padding: 12px 20px;
    border-radius: 6px;
    font-size: 14px;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
    z-index: 1000;
  }

  .notification.show {
    opacity: 1;
  }

  @media print {
    .toolbar,
    .sidebar {
      display: none !important;
    }
  }
</style>

<body>
  <div class="toolbar">
    <button id="toggle-sidebar" title="Toggle sidebar">☰</button>
    <div class="toolbar-title" id="title">Textarea</div>
  </div>

  <div class="container">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <button id="tab-current" class="active">Current</button>
        <button id="tab-others">Others</button>
      </div>
      <div id="sidebar-content" class="sidebar-content"></div>
    </aside>

    <main class="main-content">
      <textarea id="editor" class="editor" spellcheck="true" style="display: none;"></textarea>
      <div id="landing" class="landing">
        <h1>Textarea</h1>
        <p>A minimalist text editor for your thoughts</p>
        <div id="landing-docs" class="doc-list" style="display: none;">
          <div class="doc-list-title">Your notes</div>
          <div class="doc-list-items" id="landing-list"></div>
        </div>
        <button class="btn primary" id="new-btn">+ New Note</button>
      </div>
    </main>
  </div>

  <div id="notification" class="notification"></div>

  <script src="app.js"></script>
</body>
